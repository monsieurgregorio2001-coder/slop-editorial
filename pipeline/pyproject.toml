[project]
name = "slopgen"
version = "0.1.0"
description = "Prompt pack to provider APIs to review sheet to deck, with spend caps, approval gates and provenance"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["requests>=2.31", "Pillow>=10", "python-pptx>=0.6.23", "reportlab>=4", "PyYAML>=6"]

[project.scripts]
slopgen = "slopgen.cli:main"

[tool.setuptools]
packages = ["slopgen", "slopgen.providers"]
