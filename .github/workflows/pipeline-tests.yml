name: pipeline-tests
on:
  pull_request:
    paths: ["pipeline/**", "site/test/fixtures/**", "site/src/data/**", ".github/workflows/pipeline-tests.yml"]
  push:
    branches: [main]
    paths: ["pipeline/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: pipeline } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .
      - name: Parity fixtures and the mock record match the package
        run: |
          python -m slopgen.spend_fixtures --check
          python -m slopgen.mock_record --check
      - name: End to end with the free mock provider
        run: python -m slopgen all --runs-dir "$RUNNER_TEMP/runs"
