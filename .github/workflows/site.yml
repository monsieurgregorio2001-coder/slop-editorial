name: site
on:
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_BASE: /${{ github.event.repository.name }}/
      SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Voice, honesty, link and performance gates
        run: npm run check
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  behaviour:
    # Real-browser checks. Advisory until it has a track record on hosted runners.
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: build
    defaults: { run: { working-directory: site } }
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: node scripts/verify.mjs
        env: { CHROMIUM_PATH: /usr/bin/google-chrome }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: site-behaviour-screens, path: site/test-output }

  deploy:
    # Runs only on the default branch. Nothing deploys from a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
