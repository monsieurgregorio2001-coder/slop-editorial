name: site
on:
  pull_request:
    paths: ["site/**", "pipeline/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "pipeline/**", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: site
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
      SITE_BASE: /${{ github.event.repository.name }}/
      SITE_URL: https://${{ github.repository_owner }}.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: site/package-lock.json }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install -r ../pipeline/requirements.txt
      - run: mkdir -p "$RUNNER_TEMP/logs"
      - name: Site unit tests
        run: npm test 2>&1 | tee "$RUNNER_TEMP/logs/unit.txt"
      - name: Pipeline tests
        working-directory: pipeline
        run: python -m unittest discover -s tests -t . 2>&1 | tee "$RUNNER_TEMP/logs/pipeline.txt"
      - run: npm run build
      - name: Voice, honesty, link and performance gates
        run: npm run check 2>&1 | tee "$RUNNER_TEMP/logs/check.txt"
      - name: Real-browser checks
        run: npm run verify 2>&1 | tee "$RUNNER_TEMP/logs/verify.txt"
        env: { CHROMIUM_PATH: /usr/bin/google-chrome }
      - name: Write evidence.json
        run: >
          node scripts/evidence.mjs
          --unit "$RUNNER_TEMP/logs/unit.txt" --pipeline "$RUNNER_TEMP/logs/pipeline.txt"
          --check "$RUNNER_TEMP/logs/check.txt" --verify "$RUNNER_TEMP/logs/verify.txt"
      - run: cat dist/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: site-behaviour-screens, path: site/test-output }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    # Runs only on the default branch. Nothing deploys from a pull request.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
